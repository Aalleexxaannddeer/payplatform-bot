name: Keep Netlify Alive

on:
  schedule:
    - cron: '0 0 1 * *'  # Раз в месяц
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Netlify
        run: |
          curl -s https://payplatform-bot.netlify.app/.netlify/functions/telegram-webhook -X POST -d '{}'
